# Dependabot version updates for the one npm dependency tree (package.json + pnpm-lock.yaml).
# Options: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Matches pnpm's supply-chain hold (minimumReleaseAge, one day, in pnpm-workspace.yaml), so
    # Dependabot never proposes a release that pnpm would refuse to install. Cooldown does not
    # apply to security updates; pnpm's hold still does.
    cooldown:
      default-days: 1
