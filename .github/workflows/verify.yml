name: verify

# Runs the site's own gate (astro check, build, content check) on GitHub-hosted runners only: this
# repo is public, so fork PRs must never reach a self-hosted runner. No secrets, no
# pull_request_target.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The pnpm version comes from package.json's packageManager field.
      - name: enable pnpm
        run: corepack enable pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: verify
        run: pnpm run verify
